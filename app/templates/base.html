<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}房屋租赁收租管理{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- htmx -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --warning: #ff9f1c;
            --danger: #e71d36;
            --dark: #1b263b;
            --light-bg: #f8f9fc;
        }
        body { background: var(--light-bg); font-family: "PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; }
        .sidebar {
            background: linear-gradient(180deg, #1b263b 0%, #1a1a2e 100%);
            min-height: 100vh;
            padding-top: 1rem;
            position: fixed;
            width: 240px;
            z-index: 100;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            margin: 0.15rem 0.75rem;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .sidebar .nav-link i { margin-right: 0.6rem; width: 20px; text-align: center; }
        .sidebar .brand {
            color: #fff;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 0.5rem 1.5rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 0.75rem;
        }
        .main-content { margin-left: 240px; padding: 1.5rem 2rem; }
        .card-stat {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            transition: transform 0.15s;
        }
        .card-stat:hover { transform: translateY(-2px); }
        .stat-number { font-size: 2rem; font-weight: 700; }
        .stat-label { color: #6c757d; font-size: 0.85rem; }
        .badge-overdue { background: var(--danger); }
        .badge-paid { background: var(--success); }
        .badge-warning { background: var(--warning); }
        .table-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .btn-copy {
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
        }
        .copied-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: none;
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; min-height: auto; position: relative; padding-bottom: 0.5rem; }
            .main-content { margin-left: 0; padding: 1rem; }
            .sidebar .nav { display: flex; flex-wrap: wrap; gap: 0.25rem; }
            .sidebar .nav-link { padding: 0.4rem 0.8rem; font-size: 0.8rem; margin: 0; }
            .sidebar .brand { padding: 0.5rem 1rem 0.75rem; font-size: 1rem; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="brand">🏠 收租管理</div>
        <ul class="nav flex-column">
            <li><a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> 仪表盘
            </a></li>
            <li><a href="/tenants" class="nav-link {% if active_page == 'tenants' %}active{% endif %}">
                <i class="bi bi-people"></i> 租客管理
            </a></li>
            <li><a href="/payments" class="nav-link {% if active_page == 'payments' %}active{% endif %}">
                <i class="bi bi-cash-stack"></i> 缴费记录
            </a></li>
            <li><a href="/reminders" class="nav-link {% if active_page == 'reminders' %}active{% endif %}">
                <i class="bi bi-bell"></i> 催租面板
            </a></li>
            <li><a href="/bank" class="nav-link {% if active_page == 'bank' %}active{% endif %}">
                <i class="bi bi-bank"></i> 银行对账
            </a></li>
            <li><a href="/contracts" class="nav-link {% if active_page == 'contracts' %}active{% endif %}">
                <i class="bi bi-file-earmark-text"></i> 合同管理
            </a></li>
            <li><a href="/billing" class="nav-link {% if active_page == 'billing' %}active{% endif %}">
                <i class="bi bi-receipt"></i> 账单管理
            </a></li>
            <li><a href="/settings" class="nav-link {% if active_page == 'settings' %}active{% endif %}">
                <i class="bi bi-gear"></i> 系统设置
            </a></li>
            <li class="mt-auto"><a href="/logout" class="nav-link text-danger">
                <i class="bi bi-box-arrow-right"></i> 退出登录
            </a></li>
        </ul>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <!-- 复制成功提示 -->
        <div class="copied-toast alert alert-success" id="copyToast">
            <i class="bi bi-check-circle"></i> 已复制到剪贴板
        </div>

        {% block content %}{% endblock %}
    </div>

    <script>
        // 一键复制函数
        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('copyToast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
                if (btn) {
                    const orig = btn.innerHTML;
                    btn.innerHTML = '<i class="bi bi-check"></i> 已复制';
                    setTimeout(() => { btn.innerHTML = orig; }, 1500);
                }
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
