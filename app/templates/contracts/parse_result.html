{% extends "base.html" %}
{% block title %}AI 合同解析结果{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="/contracts" class="text-decoration-none text-muted"><i class="bi bi-arrow-left"></i> 返回合同列表</a>
    <h4 class="fw-bold mt-1"><i class="bi bi-magic me-2"></i>AI 合同解析结果</h4>
</div>

{% if not contract_data %}
<div class="alert alert-warning">
    <i class="bi bi-exclamation-triangle"></i> AI 解析未能提取有效信息，请手动填写合同信息。
</div>
{% endif %}

<div class="card table-card p-4">
    <form method="POST" action="/contracts/create">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">租客姓名 *</label>
                <input type="text" name="tenant_name" class="form-control"
                       value="{{ contract_data.tenant_name if contract_data else '' }}" required>
                <small class="text-muted">如果系统没有该租客，会先自动创建</small>
            </div>
            <div class="col-md-6">
                <label class="form-label">手机号</label>
                <input type="text" name="phone" class="form-control"
                       value="{{ contract_data.phone if contract_data else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">房间</label>
                <select name="room_id" class="form-select" required>
                    <option value="">选择房间</option>
                    {% for r in rooms %}
                    <option value="{{ r.id }}"
                        {% if contract_data and contract_data.room_number == r.full_room_code %}selected{% endif %}>
                        {{ r.full_room_code }} ({{ r.layout or '' }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">月租金 (元)</label>
                <input type="number" name="monthly_rent" class="form-control" step="0.01"
                       value="{{ contract_data.monthly_rent if contract_data and contract_data.monthly_rent else '' }}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">押金 (元)</label>
                <input type="number" name="deposit" class="form-control" step="0.01"
                       value="{{ contract_data.deposit if contract_data and contract_data.deposit else '' }}">
            </div>
            <div class="col-md-3">
                <label class="form-label">每月缴费日</label>
                <select name="payment_due_day" class="form-select">
                    {% for d in range(1, 29) %}
                    <option value="{{ d }}"
                        {% if contract_data and contract_data.payment_due_day == d %}selected
                        {% elif not contract_data and d == 1 %}selected{% endif %}>
                        {{ d }} 号
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">合同开始</label>
                <input type="date" name="contract_start" class="form-control"
                       value="{{ contract_data.contract_start if contract_data else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">合同到期</label>
                <input type="date" name="contract_end" class="form-control"
                       value="{{ contract_data.contract_end if contract_data else '' }}" required>
            </div>
        </div>
        <div class="mt-4 text-end">
            <a href="/contracts" class="btn btn-secondary">取消</a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> 确认并创建合同
            </button>
        </div>
    </form>
</div>
{% endblock %}
