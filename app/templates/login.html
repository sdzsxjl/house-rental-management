<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 房屋租赁收租管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1b263b 0%, #1a1a2e 50%, #16213e 100%);
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 1.8rem;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon">🏠</div>
        <h4 class="text-center fw-bold mb-1">房屋租赁收租管理</h4>
        <p class="text-center text-muted mb-4" style="font-size:0.85rem">请登录以管理系统</p>

        {% if error %}
        <div class="alert alert-danger py-2 text-center" style="font-size:0.85rem">
            <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label text-muted small">用户名</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" value="admin" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">密码</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="默认密码: admin123" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="bi bi-box-arrow-in-right"></i> 登 录
            </button>
        </form>
    </div>
</body>
</html>
